name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Build
        run: swift build
      - name: Unit tests
        run: swift test --parallel
      - name: Window tests
        run: tools/uitest.sh "$RUNNER_TEMP/uitest"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: window-snapshots
          path: ${{ runner.temp }}/uitest
