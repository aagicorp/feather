name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      # tree-sitter-dart fetches a git submodule over SSH (git@github.com:tree-sitter/tree-sitter); the runner has
      # no SSH key, so GitHub SSH addresses are read over HTTPS instead.
      - name: Use HTTPS for GitHub submodules
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"
      - name: Swift version
        run: swift --version
      - name: Build
        run: swift build
      # In one process: the tests share the app's settings store (UserDefaults), and `--parallel` runs test
      # classes in several processes at once, which then trip over each other's settings.
      - name: Unit tests
        run: swift test
      - name: Window tests
        run: tools/uitest.sh "$RUNNER_TEMP/uitest"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: window-snapshots
          path: ${{ runner.temp }}/uitest
